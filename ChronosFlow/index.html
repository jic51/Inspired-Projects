<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0E14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ChronosFlow">
<meta name="description" content="Cuánto llevas, cuánto falta. Contadores de tiempo transcurrido con barra de verde a rojo.">
<title>ChronosFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: una columna de "instrumentos". Cada contador es una tarjeta con lectura
   grande (transcurrido), lectura secundaria (falta / %) y la barra verde->rojo.
   Tema oscuro unico: se mira de reojo, y en v2 aloja video de fondo. */
:root{
  color-scheme: dark;
  --bg:#0B0E14; --bg-grad:#10141D;
  --surface:#141922; --surface-2:#1B2230; --surface-3:#222B3B;
  --border:rgba(255,255,255,.09); --border-2:rgba(255,255,255,.17);
  --fg:#EDF1F7; --fg-dim:rgba(237,241,247,.58); --fg-faint:rgba(237,241,247,.33);
  --accent:#5E9ED6; --accent-ink:#06121D;
  --display:'Barlow Condensed','Barlow Condensed Fallback',Impact,sans-serif;
  --body:'Barlow','Barlow Fallback',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%}
body{
  min-height:100%;
  background:
    radial-gradient(120% 60% at 50% 0%, var(--bg-grad) 0%, var(--bg) 62%) no-repeat,
    var(--bg);
  color:var(--fg); font-family:var(--body); font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.tnum{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.wrap{
  max-width:560px; margin:0 auto; padding-block:22px 112px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}

/* ---- cabecera ---- */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.055em;text-transform:uppercase}
.brand span{color:var(--accent)}
.clock{font-family:var(--display);font-weight:500;font-size:19px;color:var(--fg-dim);letter-spacing:.04em}

/* ---- estado vacio ---- */
.empty{padding-block:14px}
.ask{font-family:var(--display);font-weight:600;font-size:clamp(30px,9vw,42px);line-height:1.04;text-wrap:balance;margin-bottom:6px}
.ask-sub{color:var(--fg-dim);font-size:14.5px;margin-bottom:22px;max-width:40ch}
.tiles{display:grid;gap:10px}
.tile{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:14px 15px;border:1px solid var(--border);border-radius:var(--r);
  background:var(--surface);transition:background .16s,border-color .16s,transform .16s;
}
.tile:hover,.tile:focus-visible{background:var(--surface-2);border-color:var(--border-2)}
.tile:active{transform:scale(.988)}
.tile-ico{flex:0 0 auto;width:40px;height:40px;display:grid;place-items:center;border-radius:11px;background:var(--surface-3)}
.tile-ico svg{width:22px;height:22px}
.tile-txt{min-width:0;flex:1}
.tile-name{font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:.035em;text-transform:uppercase;line-height:1.1}
.tile-meta{font-size:13px;color:var(--fg-dim)}
.tile-go{color:var(--fg-faint);font-size:20px;line-height:1}

/* ---- tarjeta de contador ---- */
.list{display:grid;gap:14px}
.card{
  position:relative;border:1px solid var(--border);border-radius:18px;
  background:var(--surface);overflow:hidden;
}
.card::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:var(--tint);opacity:.85}
.card.is-over{border-color:rgba(255,70,70,.55)}
.card.is-over.blink{animation:pulse 1s steps(1,end) infinite}
@keyframes pulse{50%{border-color:rgba(255,70,70,.14)}}
.card.is-idle{opacity:.72}

.card-top{display:flex;align-items:center;gap:12px;padding:14px 16px 0}
.card-ico{flex:0 0 auto;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:var(--surface-3);color:var(--tint)}
.card-ico svg{width:19px;height:19px}
.card-id{min-width:0;flex:1}
.card-id h2{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.04em;text-transform:uppercase;line-height:1.15}
.card-win{font-size:12.5px;color:var(--fg-faint);letter-spacing:.01em}
.chip{
  flex:0 0 auto;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  padding:4px 8px;border-radius:999px;border:1px solid var(--border-2);color:var(--fg-dim);
}
.chip.on{color:var(--fg);border-color:var(--fg-faint)}
.chip.over{color:#1A0808;background:#FF5A5A;border-color:transparent}

.card-read{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;padding:8px 16px 12px}
.read-main{display:flex;align-items:baseline}
.big{font-family:var(--display);font-weight:700;font-size:clamp(48px,15vw,62px);line-height:.88;letter-spacing:-.005em;font-variant-numeric:tabular-nums}
.unit{font-family:var(--display);font-weight:500;font-size:21px;color:var(--fg-faint);letter-spacing:.04em;margin:0 11px 0 3px}
.unit:last-child{margin-right:0}
.read-label{font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--fg-faint);margin-top:5px}
.read-side{text-align:right;display:grid;gap:1px}
.pct{font-family:var(--display);font-weight:600;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.left{font-size:13px;color:var(--fg-dim);font-variant-numeric:tabular-nums}
.left.over{color:#FF6B6B;font-weight:600}

.track{height:12px;background:rgba(255,255,255,.07);overflow:hidden}
.fill{height:100%;width:0;transition:width 1s linear,background-color 1s linear}
.card.blink .fill{animation:flash 1s steps(1,end) infinite}
@keyframes flash{50%{opacity:.22}}

.card-acts{display:flex;border-top:1px solid var(--border)}
.card-acts button{
  flex:1;padding:12px 8px;font-size:13.5px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--fg-dim);transition:background .15s,color .15s;
}
.card-acts button+button{border-left:1px solid var(--border)}
.card-acts button:hover,.card-acts button:focus-visible{background:var(--surface-2);color:var(--fg)}

/* ---- boton flotante ---- */
.fab{
  position:fixed;z-index:20;
  right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(18px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:9px;padding:13px 19px 13px 16px;border-radius:999px;
  background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14.5px;
  letter-spacing:.04em;box-shadow:0 10px 26px rgba(0,0,0,.45);
}
.fab b{font-size:19px;line-height:1;font-weight:600}

/* ---- hoja de creacion ---- */
dialog{
  border:0;padding:0;background:none;color:var(--fg);max-width:none;max-height:none;
  width:100%;margin:auto auto 0;
}
dialog::backdrop{background:rgba(4,6,10,.72);backdrop-filter:blur(3px)}
.sheet{
  background:var(--surface);border:1px solid var(--border);border-bottom:0;
  border-radius:20px 20px 0 0;max-width:560px;margin:0 auto;
  padding:18px 0 calc(16px + env(safe-area-inset-bottom,0px));
  max-height:88vh;overflow-y:auto;
}
.sheet>*{
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.sheet-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.sheet-head .card-ico{width:38px;height:38px}
.sheet-head .card-ico svg{width:21px;height:21px}
.sheet-head h2{font-family:var(--display);font-weight:600;font-size:23px;letter-spacing:.04em;text-transform:uppercase;line-height:1.1;flex:1}
.x{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:var(--surface-3);color:var(--fg-dim);font-size:17px;line-height:1}
.lbl{font-size:11.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--fg-faint);margin-bottom:9px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
.dchip{
  padding:8px 13px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);
  font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;transition:all .14s;
}
.dchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.custom{display:flex;align-items:center;gap:8px;margin-bottom:20px}
.custom input{
  width:72px;padding:9px 10px;border-radius:9px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--fg);font:inherit;font-variant-numeric:tabular-nums;text-align:center;
}
.custom span{font-size:13.5px;color:var(--fg-dim)}
.sw{display:flex;align-items:center;gap:12px;padding-block:13px;border-top:1px solid var(--border);cursor:pointer}
.sw input{appearance:none;flex:0 0 auto;width:44px;height:26px;border-radius:999px;background:var(--surface-3);border:1px solid var(--border);position:relative;transition:background .18s;cursor:pointer}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--fg-dim);transition:transform .18s,background .18s}
.sw input:checked{background:var(--accent);border-color:transparent}
.sw input:checked::after{transform:translateX(18px);background:var(--accent-ink)}
.sw-txt{flex:1}
.sw-txt b{display:block;font-weight:600;font-size:15px}
.sw-txt small{color:var(--fg-faint);font-size:12.5px}
.when{display:flex;align-items:center;gap:10px;padding-bottom:16px}
.when input{
  padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);
  color:var(--fg);font:inherit;font-size:17px;font-variant-numeric:tabular-nums;
}
.when small{color:var(--fg-faint);font-size:12.5px}
.preview{
  border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  padding-block:14px;margin-bottom:18px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
}
.preview b{font-family:var(--display);font-weight:600;font-size:27px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.preview small{color:var(--fg-dim);font-size:13.5px;font-variant-numeric:tabular-nums}
.go{
  display:block;width:calc(100% - 2*max(16px,env(safe-area-inset-left,0px)));
  margin-inline:auto;padding:15px;border-radius:12px;background:var(--accent);color:var(--accent-ink);
  font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.09em;text-transform:uppercase;
}
.note{font-size:12px;color:var(--fg-faint);text-align:center;margin-top:11px;line-height:1.5}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:0s!important;transition-duration:0s!important}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Chronos<span>Flow</span></div>
    <div class="clock tnum" id="wallclock">--:--</div>
  </div>

  <section class="empty" id="empty" hidden>
    <h1 class="ask">¿Qué estás haciendo ahora?</h1>
    <p class="ask-sub">Elige una actividad y dime cuánto dura. Si ya empezaste hace rato, también.</p>
    <div class="tiles" id="tiles"></div>
  </section>

  <section class="list" id="list"></section>
</div>

<button class="fab" id="fab" hidden><b>+</b> Nuevo</button>

<dialog id="sheet">
  <form class="sheet" id="form" method="dialog">
    <div class="sheet-head">
      <span class="card-ico" id="f-ico"></span>
      <h2 id="f-name">Working</h2>
      <button type="button" class="x" id="f-close" aria-label="Cerrar">✕</button>
    </div>

    <p class="lbl">¿Cuánto va a durar?</p>
    <div class="chips" id="f-chips"></div>

    <div class="custom">
      <input type="number" id="f-h" min="0" max="48" step="1" inputmode="numeric" aria-label="Horas">
      <span>h</span>
      <input type="number" id="f-m" min="0" max="59" step="1" inputmode="numeric" aria-label="Minutos">
      <span>min</span>
    </div>

    <label class="sw" for="f-started">
      <input type="checkbox" id="f-started">
      <span class="sw-txt">
        <b>Ya empecé</b>
        <small>Para contar desde antes de abrir la app</small>
      </span>
    </label>

    <div class="when" id="f-when" hidden>
      <input type="time" id="f-time" step="60">
      <small id="f-when-note"></small>
    </div>

    <div class="preview">
      <b id="f-prev">—</b>
      <small id="f-prev2"></small>
    </div>

    <button type="submit" class="go" id="f-go">Comenzar</button>
    <p class="note">Todo se guarda en este teléfono. Sin cuenta, sin nube.</p>
  </form>
</dialog>

<script>
"use strict";
/* ---------- temas ---------- */
const ICONS = {
  cup:'<path d="M5 8.2h11v5.6a4.2 4.2 0 0 1-4.2 4.2H9.2A4.2 4.2 0 0 1 5 13.8Z"/><path d="M16 9.4h1.9a2.4 2.4 0 0 1 0 4.8H16"/><path d="M8.4 5.6c0-1 .9-1.3.9-2.2M12 5.6c0-1 .9-1.3.9-2.2"/>',
  swing:'<path d="M3.6 4.2h16.8"/><path d="M7.8 4.2 9 13M16.2 4.2 15 13"/><path d="M7.4 13.4h9.2"/><path d="M12 15.6v4.2"/>',
  book:'<path d="M12 6.6C10.4 5.1 8 4.6 4 5.1v12.8c4-.5 6.4 0 8 1.5 1.6-1.5 4-2 8-1.5V5.1c-4-.5-6.4 0-8 1.5Z"/><path d="M12 6.6v12.8"/>',
  helmet:'<path d="M4.2 15.6a7.8 7.8 0 0 1 15.6 0"/><path d="M9.6 9.3V6.6a2.4 2.4 0 0 1 4.8 0v2.7"/><path d="M2.4 15.6h19.2"/>',
  waves:'<path d="M2.6 8.4q2.4-2.2 4.8 0t4.8 0 4.8 0 4.8 0"/><path d="M2.6 12.9q2.4-2.2 4.8 0t4.8 0 4.8 0 4.8 0"/><path d="M2.6 17.4q2.4-2.2 4.8 0t4.8 0 4.8 0 4.8 0"/>'
};
function svg(k){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" '+
         'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[k]+'</svg>';
}
const THEMES = [
  {id:'deepfocus', name:'Deep Focus', icon:'cup',    tint:'#D4A72C', def:50,  sub:'Concentración'},
  {id:'playtime',  name:'Playtime',   icon:'swing',  tint:'#5FC48A', def:60,  sub:'Recreo, hijos'},
  {id:'homework',  name:'Homework',   icon:'book',   tint:'#A98BD4', def:90,  sub:'Estudio, tareas'},
  {id:'working',   name:'Working',    icon:'helmet', tint:'#E8903C', def:480, sub:'Jornada laboral'},
  {id:'funtime',   name:'Funtime',    icon:'waves',  tint:'#4FADDF', def:120, sub:'Ocio, descanso'}
];
const theme = id => THEMES.find(t => t.id === id) || THEMES[3];

/* ---------- modelo ----------
   Un contador es una lista de segmentos [{start,end}]. end=null => corriendo.
   Eso representa jornadas partidas (7-11, almuerzo, 12-16) y pausas con el
   mismo mecanismo, y el tiempo se deriva siempre de marcas absolutas: cerrar
   la pestana, dormir el telefono o cambiar de app no lo desincroniza.      */
const LS = 'chronosflow.v1';
let counters = [];

function elapsedOf(c){
  let ms = 0;
  for (const s of c.segments) ms += (s.end === null ? Date.now() : s.end) - s.start;
  return Math.max(0, ms);
}
const ratioOf = c => c.targetMs > 0 ? elapsedOf(c) / c.targetMs : 0;
const startedAt = c => c.segments[0].start;
const isRunning = c => c.status === 'running';

function load(){
  try{
    const raw = localStorage.getItem(LS);
    if (!raw) return [];
    const list = JSON.parse(raw);
    return Array.isArray(list) ? list.filter(c => c && Array.isArray(c.segments) && c.segments.length) : [];
  }catch(e){ return []; }
}
function save(){
  try{ localStorage.setItem(LS, JSON.stringify(counters)); }catch(e){}
}

/* ---------- formato ---------- */
const pad = n => String(n).padStart(2,'0');
/* La lectura principal se lee como duracion ("8h 40m"), nunca como una hora
   del reloj ("8:40"), que es exactamente la confusion que la app resuelve. */
function hero(ms, mode){
  const t = Math.max(0, Math.floor(ms/1000));
  const big = v => '<span class="big">' + v + '</span>';
  const u   = v => '<span class="unit">' + v + '</span>';
  if (mode === 'ms') return big(Math.floor(t/60)) + u('m') + big(pad(t%60)) + u('s');
  return big(Math.floor(t/3600)) + u('h') + big(pad(Math.floor(t%3600/60))) + u('m');
}
function fmtDur(ms){
  const t = Math.max(0, Math.round(ms/1000));
  const h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60;
  if (h) return m ? h+'h '+m+'m' : h+'h';
  if (m) return m+'m';
  return s+'s';
}
function fmtTime(ts){
  const d = new Date(ts);
  return pad(d.getHours()) + ':' + pad(d.getMinutes());
}

/* Verde encendido -> amarillo -> rojo muy encendido. Toda la barra del mismo
   color; lo que cambia con el progreso es el color, no un degradado interno. */
function ramp(p){
  const x = Math.min(1, Math.max(0, p));
  return 'hsl(' + (142*(1-x)).toFixed(1) + ' ' + (70+26*x).toFixed(1) + '% ' + (46+6*x).toFixed(1) + '%)';
}

/* ---------- alerta ---------- */
let audioOK = false;
addEventListener('pointerdown', () => { audioOK = true; }, {once:true});
addEventListener('keydown',     () => { audioOK = true; }, {once:true});
let actx = null;
function bell(){
  if (!audioOK) return;
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = actx || new AC();
    const t0 = actx.currentTime;
    [880, 1320, 2640].forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.22 / (i+1), t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0008, t0 + 1.9 - i*0.45);
      o.connect(g).connect(actx.destination);
      o.start(t0); o.stop(t0 + 2);
    });
  }catch(e){}
}
function notify(c){
  try{
    if (window.Notification && Notification.permission === 'granted'){
      new Notification(theme(c.theme).name + ' — tiempo cumplido', {
        body: 'Llevas ' + fmtDur(elapsedOf(c)) + '.', tag: c.id
      });
    }
  }catch(e){}
}

/* ---------- vistas ---------- */
const $ = id => document.getElementById(id);
const elList = $('list'), elEmpty = $('empty'), elFab = $('fab');
const views = new Map();

function mount(c){
  const t = theme(c.theme);
  const el = document.createElement('article');
  el.className = 'card';
  el.style.setProperty('--tint', t.tint);
  el.dataset.id = c.id;
  el.innerHTML =
    '<div class="card-top">'+
      '<span class="card-ico">'+svg(t.icon)+'</span>'+
      '<div class="card-id"><h2>'+t.name+'</h2><p class="card-win"></p></div>'+
      '<span class="chip"></span>'+
    '</div>'+
    '<div class="card-read">'+
      '<div><div class="read-main"></div>'+
      '<p class="read-label">transcurrido</p></div>'+
      '<div class="read-side"><span class="pct">0%</span><span class="left"></span></div>'+
    '</div>'+
    '<div class="track"><div class="fill"></div></div>'+
    '<div class="card-acts">'+
      '<button type="button" data-act="toggle">Pausar</button>'+
      '<button type="button" data-act="finish">Finalizar</button>'+
    '</div>';
  const refs = {
    el, win: el.querySelector('.card-win'), chip: el.querySelector('.chip'),
    main: el.querySelector('.read-main'),
    pct: el.querySelector('.pct'), left: el.querySelector('.left'),
    fill: el.querySelector('.fill'), toggle: el.querySelector('[data-act=toggle]')
  };
  views.set(c.id, refs);
  return refs;
}

function paint(c){
  const r = views.get(c.id);
  if (!r) return;
  const el = elapsedOf(c), raw = ratioOf(c), p = Math.min(1, raw);
  const over = raw >= 1, mode = c.targetMs >= 3600000 ? 'hm' : 'ms';

  r.main.innerHTML = hero(el, mode);
  r.pct.textContent = Math.floor(p*100) + '%';
  r.pct.style.color = ramp(p);
  r.fill.style.width = (p*100) + '%';
  r.fill.style.backgroundColor = ramp(p);

  if (over){
    r.left.textContent = '+' + fmtDur(el - c.targetMs) + ' de más';
    r.left.classList.add('over');
  } else {
    r.left.textContent = 'faltan ' + fmtDur(c.targetMs - el);
    r.left.classList.remove('over');
  }

  const end = c.status === 'done' ? c.segments[c.segments.length-1].end
            : isRunning(c)        ? Date.now() + (c.targetMs - el)
            : null;
  r.win.textContent = fmtTime(startedAt(c)) + ' → ' + (end === null ? 'en pausa' : fmtTime(end));

  r.chip.className = 'chip' + (c.status === 'done' ? '' : over ? ' over' : isRunning(c) ? ' on' : '');
  r.chip.textContent = c.status === 'done' ? 'Terminado' : over ? 'Cumplido' : isRunning(c) ? 'En curso' : 'En pausa';
  r.toggle.textContent = isRunning(c) ? 'Pausar' : 'Reanudar';

  el_class(r.el, 'is-over', over && c.status !== 'done');
  el_class(r.el, 'blink',   over && isRunning(c));
  el_class(r.el, 'is-idle', c.status !== 'running');
}
function el_class(el, name, on){ el.classList[on ? 'add' : 'remove'](name); }

function render(){
  const ids = new Set(counters.map(c => c.id));
  for (const [id, r] of views) if (!ids.has(id)){ r.el.remove(); views.delete(id); }
  counters.forEach(c => {
    const r = views.get(c.id) || mount(c);
    elList.appendChild(r.el);
    paint(c);
  });
  elEmpty.hidden = counters.length > 0;
  elFab.hidden   = counters.length === 0;
}

function tick(){
  const d = new Date(Date.now());
  $('wallclock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
  let dirty = false;
  counters.forEach(c => {
    paint(c);
    if (isRunning(c) && !c.alerted && ratioOf(c) >= 1){
      c.alerted = true; dirty = true;
      bell(); notify(c);
    }
  });
  if (dirty) save();
  if (sheet.open) preview();
}

/* ---------- acciones ---------- */
elList.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const c = counters.find(x => x.id === btn.closest('.card').dataset.id);
  if (!c) return;
  const last = c.segments[c.segments.length-1];
  if (btn.dataset.act === 'toggle'){
    if (isRunning(c)){ last.end = Date.now(); c.status = 'paused'; }
    else { c.segments.push({start: Date.now(), end: null}); c.status = 'running'; }
  } else {
    if (last.end === null) last.end = Date.now();
    counters = counters.filter(x => x.id !== c.id);
  }
  save(); render();
});

/* ---------- hoja de creacion ---------- */
const sheet = $('sheet');
const PRESETS = [15, 25, 30, 50, 60, 120, 240, 480, 720];
let draft = {theme:'working', mins:480};

$('f-chips').innerHTML = PRESETS.map(m =>
  '<button type="button" class="dchip" data-min="'+m+'" aria-pressed="false">'+
  (m < 60 ? m+' min' : (m/60) + (m === 60 ? ' hora' : ' horas')) + '</button>').join('');

function openSheet(themeId){
  const t = theme(themeId);
  draft = {theme: t.id, mins: t.def};
  $('f-ico').innerHTML = svg(t.icon);
  $('f-ico').style.color = t.tint;
  $('f-name').textContent = t.name;
  $('f-started').checked = false;
  $('f-when').hidden = true;
  const d = new Date(Date.now());
  $('f-time').value = pad(d.getHours()) + ':' + pad(d.getMinutes());
  syncMins();
  sheet.showModal();
}
function syncMins(){
  $('f-h').value = Math.floor(draft.mins/60);
  $('f-m').value = draft.mins % 60;
  document.querySelectorAll('.dchip').forEach(b =>
    b.setAttribute('aria-pressed', String(+b.dataset.min === draft.mins)));
  preview();
}
$('f-chips').addEventListener('click', e => {
  const b = e.target.closest('.dchip');
  if (!b) return;
  draft.mins = +b.dataset.min;
  syncMins();
});
['f-h','f-m'].forEach(id => $(id).addEventListener('input', () => {
  const h = Math.max(0, Math.min(48, +$('f-h').value || 0));
  const m = Math.max(0, Math.min(59, +$('f-m').value || 0));
  draft.mins = h*60 + m;
  document.querySelectorAll('.dchip').forEach(b =>
    b.setAttribute('aria-pressed', String(+b.dataset.min === draft.mins)));
  preview();
}));
$('f-started').addEventListener('change', e => { $('f-when').hidden = !e.target.checked; preview(); });
$('f-time').addEventListener('input', preview);
$('f-close').addEventListener('click', () => sheet.close());
sheet.addEventListener('click', e => { if (e.target === sheet) sheet.close(); });

/* Hora de inicio elegida: hoy a esa hora, o ayer si esa hora aun no ha llegado.
   Resuelve el caso real: "entre a las 7:00" escrito a las 15:40, y tambien
   un turno de noche abierto a las 23:00 y consultado a las 02:00.          */
function resolveStart(){
  if (!$('f-started').checked) return Date.now();
  const v = ($('f-time').value || '').split(':');
  if (v.length < 2) return Date.now();
  const d = new Date(Date.now());
  d.setHours(+v[0] || 0, +v[1] || 0, 0, 0);
  if (d.getTime() > Date.now()) d.setDate(d.getDate() - 1);
  return d.getTime();
}
function preview(){
  const targetMs = draft.mins * 60000;
  const start = resolveStart();
  const el = Date.now() - start;
  const back = $('f-started').checked;
  const yesterday = back && new Date(start).getDate() !== new Date(Date.now()).getDate();
  $('f-when-note').textContent = yesterday ? 'ayer · hace ' + fmtDur(el) : 'hace ' + fmtDur(el);

  const go = $('f-go');
  if (targetMs <= 0){
    $('f-prev').textContent = '—';
    $('f-prev2').textContent = 'Pon una duración mayor que cero.';
    go.disabled = true; go.style.opacity = .45;
    return;
  }
  go.disabled = false; go.style.opacity = 1;

  if (!back){
    $('f-prev').textContent = 'Termina ' + fmtTime(start + targetMs);
    $('f-prev2').textContent = fmtDur(targetMs) + ' desde ahora';
  } else if (el >= targetMs){
    $('f-prev').textContent = 'Ya cumplido';
    $('f-prev2').textContent = 'llevas ' + fmtDur(el) + ' · ' + fmtDur(el - targetMs) + ' de más';
  } else {
    $('f-prev').textContent = 'Llevas ' + fmtDur(el);
    $('f-prev2').textContent = 'faltan ' + fmtDur(targetMs - el) +
      ' · ' + Math.floor(el/targetMs*100) + '% · termina ' + fmtTime(start + targetMs);
  }
}
$('form').addEventListener('submit', e => {
  e.preventDefault();
  if (draft.mins <= 0) return;
  counters.push({
    id: 'cf_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    theme: draft.theme,
    targetMs: draft.mins * 60000,
    segments: [{start: resolveStart(), end: null}],
    status: 'running',
    alerted: false,
    createdAt: Date.now()
  });
  save(); render(); sheet.close();
  try{
    if (window.Notification && Notification.permission === 'default') Notification.requestPermission();
  }catch(err){}
});

/* ---------- arranque ---------- */
$('tiles').innerHTML = THEMES.map(t =>
  '<button type="button" class="tile" data-theme="'+t.id+'">'+
    '<span class="tile-ico" style="color:'+t.tint+'">'+svg(t.icon)+'</span>'+
    '<span class="tile-txt"><span class="tile-name">'+t.name+'</span>'+
    '<span class="tile-meta">'+t.sub+' · '+fmtDur(t.def*60000)+' por defecto</span></span>'+
    '<span class="tile-go">›</span>'+
  '</button>').join('');
$('tiles').addEventListener('click', e => {
  const b = e.target.closest('.tile');
  if (b) openSheet(b.dataset.theme);
});
elFab.addEventListener('click', () => openSheet(counters.length ? counters[counters.length-1].theme : 'working'));

counters = load();
render(); tick();
setInterval(tick, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
window.CF = {counters: () => counters, elapsedOf, ratioOf, ramp, fmtDur, hero, render, save};
</script>
</body>
